 }
 * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

 }
 #app { max-width: 480px; margin: 0 auto; padding: 20px 18px 60px; }

 background: var(--ink-2); border: 1px solid var(--line); border-radius: 12px;

 }
 .user-info { display: flex; align-items: center; gap: 8px; overflow: hidden; }
 .user-avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--brass); color: var(--ink); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; flex-shrink: 0; }
 .user-email { color: var(--text-hi); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
 .user-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
 .icon-btn { background: none; border: 1px solid var(--line); color: var(--text-lo); padding: 4px 8px; border-radius: 6px; font-size: 11px; cursor: pointer; }
 .icon-btn:active { color: var(--brass-bright); border-color: var(--brass-bright); }
 .logout-btn { background: none; border: 1px solid var(--line); color: var(--text-lo); padding: 4px 8px; border-radius: 6px; font-size: 11px; cursor: pointer; }
 .logout-btn:active { color: var(--rust); border-color: var(--rust); }

 .auth-card {

 padding: 24px; text-align: center; margin-top: 20px;
 }
 .auth-card h2 { font-family: var(--serif); font-size: 22px; margin: 0 0 8px; }
 .auth-card p { font-size: 13.5px; color: var(--text-lo); margin-bottom: 20px; line-height: 1.4; }

 .auth-prefs { display: flex; gap: 8px; margin-bottom: 16px; }
 .auth-prefs select { flex: 1; background: var(--ink); border: 1px solid var(--line); border-radius: 10px; color: var(--text-hi); font-family: var(--sans); font-size: 12.5px; padding: 8px 6px; }

 .auth-tabs button { flex: 1; padding: 9px 0; border: none; border-radius: 8px; background: none; color: var(--text-lo); font-family: var(--sans); font-weight: 600; font-size: 13.5px; cursor: pointer; }
 .auth-tabs button.active { background: var(--brass); color: var(--ink); }

 .auth-field { text-align: left; margin-bottom: 12px; }

 .auth-field label { display: block; font-size: 12px; color: var(--text-lo); margin-bottom: 5px; }
 .auth-field input, .auth-field select { width: 100%; background: var(--ink); border: 1px solid var(--line); border-radius: 10px; color: var(--text-hi); font-family: var(--sans); font-size: 14.5px; padding: 11px 12px; }
 .auth-field input::placeholder { color: var(--text-lo); }
 .auth-field input:focus, .auth-field select:focus { outline: none; border-color: var(--brass); }

 .auth-error { background: rgba(177,90,71,0.12); border: 1px solid rgba(177,90,71,0.4); color: #E8A79A; font-size: 12.5px; border-radius: 10px; padding: 9px 11px; margin-bottom: 12px; text-align: left; display: none; line-height: 1.4; }
 [dir="rtl"] .auth-error { text-align: right; }
 .auth-error.show { display: block; }

 .auth-success { background: rgba(92,138,110,0.12); border: 1px solid rgba(92,138,110,0.4); color: #A9CBB4; font-size: 12.5px; border-radius: 10px; padding: 9px 11px; margin-bottom: 12px; text-align: left; display: none; line-height: 1.4; }
 [dir="rtl"] .auth-success { text-align: right; }
 .auth-success.show { display: block; }

 }

 border-radius: 14px; padding: 4px; margin-bottom: 16px;

 flex: 1; padding: 10px 0; border: none; border-radius: 10px; background: none;
 color: var(--text-lo); font-family: var(--sans); font-weight: 600; font-size: 14px; cursor: pointer;
 }
 .tabs button.active { background: var(--brass); color: var(--ink); }

 }
 .month-bar button {

 }
 .month-bar button:active { background: var(--line); }
 .month-label { font-family: var(--serif); font-size: 17px; font-weight: 600; }

 }
 .hero::after {

 }

 const REGION_CURRENCY = { pk:"PKR", us:"USD", gb:"GBP", in:"INR", ae:"AED", sa:"SAR", qa:"QAR", kw:"KWD", bh:"BHD", om:"OMR", cn:"CNY", jp:"JPY", kr:"KRW", tr:"TRY", ru:"RUB", br:"BRL", za:"ZAR", ng:"NGN", eg:"EGP", bd:"BDT", id:"IDR", my:"MYR", th:"THB", ph:"PHP", vn:"VND", ca:"CAD", au:"AUD", ch:"CHF", sg:"SGD", ke:"KES", gh:"GHS", de:"EUR", fr:"EUR", es:"EUR", it:"EUR", pt:"EUR" };

 function t(key) {
 const lang = state.settings.lang;
 return (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;
 }

 function guessDefaultSettings() {
 const nav = (navigator.language || 'en').toLowerCase();
 const langCode = nav.split('-')[0];
 const lang = I18N[langCode] ? langCode : 'en';
 const region = nav.split('-')[1] || '';
 const currency = REGION_CURRENCY[region] || 'PKR';
 return { lang, currency };
 }

 function applyDocumentDirection() {
 const meta = LANG_META[state.settings.lang];
 document.documentElement.setAttribute('lang', state.settings.lang);
 document.documentElement.setAttribute('dir', (meta && meta.rtl) ? 'rtl' : 'ltr');
 }

 const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
 let currentUser = null;
 let view = 'salary';
 let authMode = 'signin'; // 'signin' | 'signup'
 let settingsOpen = false;

 let storedSettings = null;
 try { storedSettings = JSON.parse(localStorage.getItem('salaryLedgerSettings') || 'null'); } catch (e) { storedSettings = null; }

 let state = {
 year: new Date().getFullYear(),
 month: new Date().getMonth(),
 earnings: [{ name: "Basic pay", amount: 0 }],
 deductions: [],
 expenses: [],
 settings: storedSettings || guessDefaultSettings()
 };
 applyDocumentDirection();

 let history = [];
 let monthListener = null;
 let historyListener = null;
 let settingsListener = null;

 function monthPath(uid, year, month) {
 return `users/${uid}/ledger/${year}-${String(month+1).padStart(2,'0')}`;
 }
 function fmt(n) {
 const v = Number(n) || 0;
 try { return v.toLocaleString(state.settings.lang, { maximumFractionDigits: 2 }); }
 catch (e) { return v.toLocaleString(undefined, { maximumFractionDigits: 2 }); }
 }
 function money(n) {
 const cur = CURRENCIES[state.settings.currency] || CURRENCIES.PKR;
 return `${cur.symbol} ${fmt(n)}`;
 }
 function monthYearLabel(y, m) {
 try { return new Intl.DateTimeFormat(state.settings.lang, { month: 'long', year: 'numeric' }).format(new Date(y, m, 1)); }
 catch (e) { return `${MONTHS[m]} ${y}`; }
 }
 function monthOnlyLabel(y, m) {
 try { return new Intl.DateTimeFormat(state.settings.lang, { month: 'long' }).format(new Date(y, m, 1)); }
 catch (e) { return MONTHS[m]; }
 }
 function sum(arr) { return arr ? arr.reduce((a,b) => a + (Number(b.amount) || 0), 0) : 0; }
 function daysInMonth(year, month) { return new Date(year, month + 1, 0).getDate(); }

 // Turns Firebase's auth error codes into messages a human can act on
 function friendlyAuthError(err) {
 const code = err && err.code ? err.code : '';
 switch (code) {
 case 'auth/invalid-login-credentials':
 case 'auth/invalid-credential':
 case 'auth/wrong-password':
 case 'auth/user-not-found':
 return "That email and password don't match an existing account. If you're new here, switch to \"Create account\" below.";
 case 'auth/email-already-in-use':
 return "An account already exists with that email. Try signing in instead.";
 case 'auth/weak-password':
 return "Password is too weak — please use at least 6 characters.";
 case 'auth/invalid-email':
 return "That doesn't look like a valid email address.";
 case 'auth/missing-password':
 return "Please enter a password.";
 case 'auth/too-many-requests':
 return "Too many attempts. Please wait a bit and try again.";
 case 'auth/network-request-failed':
 return "Network error — check your connection and try again.";
 case 'auth/operation-not-allowed':
 return "Email/Password sign-in isn't enabled for this project yet. Enable it in the Firebase Console under Authentication → Sign-in method.";
 default:
 return err && err.message ? err.message : "Something went wrong. Please try again.";
 }
 }

 // Observe Firebase Auth state changes
 auth.onAuthStateChanged((user) => {
 currentUser = user;
 if (user) {
 document.getElementById('userBar').style.display = 'flex';
 document.getElementById('syncBadge').style.display = 'inline';

 if (user.isAnonymous) {
 document.getElementById('userEmail').textContent = 'Guest User (Local Device)';
 document.getElementById('userAvatar').textContent = 'G';
 } else {
 document.getElementById('userEmail').textContent = user.email || 'Google User';
 document.getElementById('userAvatar').textContent = (user.email || 'U').charAt(0).toUpperCase();
 }
 listenToSettings(user.uid);
 listenToMonth(state.year, state.month);
 listenToHistory();
 } else {
 document.getElementById('userBar').style.display = 'none';
 document.getElementById('syncBadge').style.display = 'none';
 if (monthListener) monthListener.off();
 if (historyListener) historyListener.off();
 if (settingsListener) settingsListener.off();
 renderAuthScreen();
 }
 });

 function listenToSettings(uid) {
 if (settingsListener) settingsListener.off();
 settingsListener = db.ref(`users/${uid}/settings`);
 settingsListener.on('value', (snapshot) => {
 const data = snapshot.val();
 if (data && data.lang && data.currency) {
 state.settings = { lang: data.lang, currency: data.currency };
 } else {
 db.ref(`users/${uid}/settings`).set(state.settings);
 }
 localStorage.setItem('salaryLedgerSettings', JSON.stringify(state.settings));
 applyDocumentDirection();
 document.getElementById('eyebrowText').textContent = t('appEyebrow');
 document.getElementById('titleText').textContent = t('appTitle');
 document.getElementById('signOutBtn').textContent = t('signOut');
 render();
 });
 }

 function listenToMonth(year, month) {
 if (!currentUser) return;
 if (monthListener) monthListener.off();
 const path = monthPath(currentUser.uid, year, month);
 monthListener = db.ref(path);
 monthListener.on('value', (snapshot) => {
 const data = snapshot.val();
 if (data) {
 state.earnings = data.earnings || [{ name: t('basicPay'), amount: 0 }];
 state.deductions = data.deductions || [];
 state.expenses = (data.expenses || []).sort((a,b) => a.day - b.day);
 } else {
 state.earnings = [{ name: t('basicPay'), amount: 0 }];
 state.deductions = [];
 state.expenses = [];
 }
 render();
 });
 }
 function listenToHistory() {
 if (!currentUser) return;
 if (historyListener) historyListener.off();
 historyListener = db.ref(`users/${currentUser.uid}/ledger`);
 historyListener.on('value', (snapshot) => {
 const data = snapshot.val() || {};
 const items = [];
 Object.keys(data).forEach((key) => {
 const [y, m] = key.split('-').map(Number);
 const monthData = data[key];
 const gross = sum(monthData.earnings);
 const ded = sum(monthData.deductions);
 const spent = sum(monthData.expenses);
 items.push({ key, year: y, month: m - 1, gross, ded, spent, net: gross - ded });
 });
 items.sort((a,b) => (b.year - a.year) || (b.month - a.month));
 history = items;
 render();
 });
 }
 function saveSalary() {
 if (!currentUser) return;
 const path = monthPath(currentUser.uid, state.year, state.month);
 db.ref(path).update({ year: state.year, month: state.month, earnings: state.earnings, deductions: state.deductions });
 flashMsg();
 }
 function saveExpenses() {
 if (!currentUser) return;
 const path = monthPath(currentUser.uid, state.year, state.month);
 db.ref(path).update({ year: state.year, month: state.month, expenses: state.expenses });
 }
 function flashMsg() {
 const msg = document.getElementById('saveMsg');
 if (msg) {
 msg.classList.add('show');
 setTimeout(() => msg.classList.remove('show'), 1800);
 }
 }

 ${Object.keys(CURRENCIES).map(code => `<option value="${code}" ${state.settings.currency===code?'selected':''}>${code} (${CURRENCIES[code].symbol})</option>`).join('')}

 </div>

 <div class="auth-tabs">
 <button class="${!isSignup ? 'active' : ''}" onclick="__salaryApp.setAuthMode('signin')">${t('signIn')}</button>
 <button class="${isSignup ? 'active' : ''}" onclick="__salaryApp.setAuthMode('signup')">${t('createAccount')}</button>
 </div>

 <div class="auth-error" id="authError"></div>
 <div class="auth-success" id="authSuccess"></div>

 <div class="auth-field">
 <label for="authEmail">${t('emailLabel')}</label>
 <input type="email" id="authEmail" placeholder="you@example.com" autocomplete="email">
 </div>
 <div class="auth-field">
 <label for="authPassword">${t('passwordLabel')}</label>
 <input type="password" id="authPassword" placeholder="${isSignup ? t('passwordSignupPh') : t('passwordSigninPh')}" autocomplete="${isSignup ? 'new-password' : 'current-password'}">
 </div>

 <button class="auth-btn-primary" id="authSubmitBtn" onclick="__salaryApp.submitEmailAuth()">
 ${isSignup ? t('createAccount') : t('signIn')}
 </button>

 ${isSignup ? '' : `<button class="auth-forgot" onclick="__salaryApp.resetPassword()">${t('forgotPassword')}</button>`}

 <div class="auth-divider">${t('orDivider')}</div>

 <button class="auth-btn-google" onclick="__salaryApp.loginWithGoogle()">
 <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
 ${t('continueGoogle')}
 </button>
 <button class="auth-btn-guest" onclick="__salaryApp.loginGuest()">
 ${t('continueGuest')}
 </button>
 </div>
 `;

 const emailEl = document.getElementById('authEmail');
 const passEl = document.getElementById('authPassword');
 [emailEl, passEl].forEach(el => {
 el.addEventListener('keydown', (e) => { if (e.key === 'Enter') __salaryApp.submitEmailAuth(); });
 });

 renderSettingsOverlay();
 }

 function renderSalaryView() {
 const gross = sum(state.earnings);
 const ded = sum(state.deductions);
 const net = gross - ded;
 return `
 <div class="hero">
 <div class="label">${t('netPayMonth')}</div>
 <div class="amount">${money(net)}</div>
 <div class="sub">
 <span>${t('grossLabel')} <b>${money(gross)}</b></span>
 <span>${t('deductionsLabel')} <b>${money(ded)}</b></span>
 </div>
 </div>
 <div class="card earnings">
 <h2>${t('earningsLabel')} <button class="add-btn" onclick="__salaryApp.add('earnings')">${t('addLine')}</button></h2>
 <div id="earningsRows">${rowsHtml('earnings')}</div>
 <div class="total-row"><span>${t('totalEarnings')}</span><span class="val">${money(gross)}</span></div>
 </div>
 <div class="card deductions">
 <h2>${t('deductionsLabel')} <button class="add-btn" onclick="__salaryApp.add('deductions')">${t('addLine')}</button></h2>
 <div id="deductionsRows">${rowsHtml('deductions')}</div>
 <div class="total-row"><span>${t('totalDeductions')}</span><span class="val">${money(ded)}</span></div>
 </div>
 <button class="save-btn" onclick="__salaryApp.save()">${t('saveBtn')} ${monthYearLabel(state.year, state.month)}</button>
 <div class="save-msg" id="saveMsg">${t('savedMsg')}</div>
 `;
 }
 function renderSpendingView() {
 const gross = sum(state.earnings);
 const ded = sum(state.deductions);
 const net = gross - ded;
 const spent = sum(state.expenses);
 const remaining = net - spent;
 return `
 <div class="hero">
 <div class="label">${t('remainingAfterSpending')}</div>
 <div class="amount">${money(remaining)}</div>
 <div class="sub">
 <span>${t('netPayShort')} <b>${money(net)}</b></span>
 <span>${t('spentSoFar')} <b>${money(spent)}</b></span>
 </div>
 </div>
 <div class="card spending">
 <h2>${t('addExpenseTitle')}</h2>
 <div class="expense-form">
 <input type="number" class="day-input" id="expDay" min="1" max="${daysInMonth(state.year, state.month)}" value="${todayDefaultDay()}" placeholder="${monthOnlyLabel(state.year,state.month).slice(0,3)}">
 <input type="text" class="note-input" id="expNote" placeholder="${t('whatSpentOn')}">
 <input type="number" class="amt-input" id="expAmt" placeholder="${(CURRENCIES[state.settings.currency]||CURRENCIES.PKR).symbol}">
 <button class="add-expense-btn" onclick="__salaryApp.addExpense()" aria-label="Add expense">+</button>
 </div>
 </div>
 <div class="card spending">
 <h2>${monthOnlyLabel(state.year, state.month)} ${t('tabSpending').toLowerCase()}</h2>
 <div id="expenseRows">${expenseRowsHtml()}</div>
 <div class="total-row"><span>${t('totalSpent')}</span><span class="val">${money(spent)}</span></div>
 </div>
 <div class="save-msg show" style="color: var(--text-lo);" id="remainingNote">${money(remaining)} ${t('leftOfNetPay')}</div>
 `;
 }
 function rowsHtml(type) {
 return state[type].map((item, idx) => `
 <div class="row">
 <input type="text" placeholder="${type === 'earnings' ? t('placeholderEarning') : t('placeholderDeduction')}"
 value="${(item.name || '').replace(/"/g,'&quot;')}"
 oninput="__salaryApp.setName('${type}', ${idx}, this.value)">
 <div class="amt-wrap">
 <span>${(CURRENCIES[state.settings.currency]||CURRENCIES.PKR).symbol}</span>
 <input type="number" inputmode="decimal" value="${item.amount || ''}" placeholder="0"
 oninput="__salaryApp.setAmount('${type}', ${idx}, this.value)">
 </div>
 <button class="del" onclick="__salaryApp.remove('${type}', ${idx})" aria-label="Remove">✕</button>
 </div>
 `).join('');
 }
 function expenseRowsHtml() {
 if (!state.expenses.length) return `<div class="empty-state">${t('noSpendingLogged')} ${monthOnlyLabel(state.year, state.month)}.</div>`;
 return state.expenses.map((item) => `
 <div class="expense-row">
 <div class="day-badge">${item.day}</div>
 <div class="note">${(item.note || 'Expense').replace(/</g,'&lt;')}</div>
 <div class="amt">${money(item.amount)}</div>
 <button class="del" onclick="__salaryApp.removeExpense('${item.id}')" aria-label="Remove">✕</button>
 </div>
 `).join('');
 }
 function historyHtml() {
 if (!history.length) return `<div class="empty-state">${t('noSavedMonths')}</div>`;
 return history.map(h => `
 <div class="history-item" onclick="__salaryApp.goTo(${h.year}, ${h.month})">
 <div class="h-left">
 <div class="h-month">${monthYearLabel(h.year, h.month)}</div>
 <div class="h-sub">${t('grossLabel')} ${money(h.gross)} · ${t('spentSoFar')} ${money(h.spent)}</div>
 </div>
 <div class="h-net">${money(h.net - h.spent)}</div>
 </div>
 `).join('');
 }
 function todayDefaultDay() {
 const now = new Date();
 if (now.getFullYear() === state.year && now.getMonth() === state.month) return now.getDate();
 return 1;
 }
 function renderSettingsOverlay() {
 const el = document.getElementById('settingsOverlay');
 if (!el) return;
 el.className = 'settings-overlay' + (settingsOpen ? ' open' : '');
 el.innerHTML = settingsOpen ? `
 <div class="settings-card">
 <h2>${t('settingsBtn')}</h2>
 <div class="auth-field">
 <label>${t('languageLabel')}</label>
 <select onchange="__salaryApp.changeLang(this.value)">
 ${Object.keys(LANG_META).map(code => `<option value="${code}" ${state.settings.lang===code?'selected':''}>${LANG_META[code].name}</option>`).join('')}
 </select>
 </div>
 <div class="auth-field">
 <label>${t('currencyLabel')}</label>
 <select onchange="__salaryApp.changeCurrency(this.value)">
 ${Object.keys(CURRENCIES).map(code => `<option value="${code}" ${state.settings.currency===code?'selected':''}>${code} — ${CURRENCIES[code].symbol} — ${CURRENCIES[code].name}</option>`).join('')}
 </select>
 </div>
 <button class="auth-btn-primary" onclick="__salaryApp.toggleSettings()">${t('done')}</button>
 </div>
 ` : '';
 }
 function render() {
 if (!currentUser) return;
 document.getElementById('eyebrowText').textContent = t('appEyebrow');
 document.getElementById('titleText').textContent = t('appTitle');
 document.getElementById('signOutBtn').textContent = t('signOut');
 document.getElementById('content').innerHTML = `
 <div class="tabs">
 <button class="${view === 'salary' ? 'active' : ''}" onclick="__salaryApp.setView('salary')">${t('tabSalary')}</button>
 <button class="${view === 'spending' ? 'active' : ''}" onclick="__salaryApp.setView('spending')">${t('tabSpending')}</button>
 </div>
 <div class="month-bar">
 <button onclick="__salaryApp.shiftMonth(-1)">‹</button>
 <div class="month-label">${monthYearLabel(state.year, state.month)}</div>
 <button onclick="__salaryApp.shiftMonth(1)">›</button>
 </div>
 ${view === 'salary' ? renderSalaryView() : renderSpendingView()}
 <div class="card" style="margin-top: 22px;">
 <h2>${t('historyLabel')}</h2>
 <div id="historyList">${historyHtml()}</div>
 </div>
 `;
 renderSettingsOverlay();
 }

 window.__salaryApp = {
 async loginWithGoogle() {
 const provider = new firebase.auth.GoogleAuthProvider();
 try { await auth.signInWithPopup(provider); }
 catch (err) { alert(friendlyAuthError(err)); }
 },
 async loginGuest() {
 try { await auth.signInAnonymously(); }
 catch (err) { alert("Guest login failed: " + friendlyAuthError(err)); }
 },
 logout() { auth.signOut(); },

 setAuthMode(mode) { authMode = mode; renderAuthScreen(); },

 toggleSettings() {
 settingsOpen = !settingsOpen;
 if (currentUser) render(); else renderAuthScreen();
 },
 changeLang(code) {
 state.settings.lang = code;
 localStorage.setItem('salaryLedgerSettings', JSON.stringify(state.settings));
 applyDocumentDirection();
 if (currentUser) db.ref(`users/${currentUser.uid}/settings`).set(state.settings);
 if (currentUser) render(); else renderAuthScreen();
 },
 changeCurrency(code) {
 state.settings.currency = code;
 localStorage.setItem('salaryLedgerSettings', JSON.stringify(state.settings));
 if (currentUser) db.ref(`users/${currentUser.uid}/settings`).set(state.settings);
 if (currentUser) render(); else renderAuthScreen();
 },

 async submitEmailAuth() {
 const errEl = document.getElementById('authError');
 const okEl = document.getElementById('authSuccess');
 const btn = document.getElementById('authSubmitBtn');
 const email = document.getElementById('authEmail').value.trim();
 const password = document.getElementById('authPassword').value;

 errEl.classList.remove('show');
 okEl.classList.remove('show');

 if (!email || !password) {
 errEl.textContent = "Please fill in both email and password.";
 errEl.classList.add('show');
 return;
 }

 btn.disabled = true;
 const originalLabel = btn.textContent;
 btn.textContent = authMode === 'signup' ? 'Creating account…' : 'Signing in…';

 try {
 if (authMode === 'signup') {
 await auth.createUserWithEmailAndPassword(email, password);
 } else {
 await auth.signInWithEmailAndPassword(email, password);
 }
 } catch (err) {
 errEl.textContent = friendlyAuthError(err);
 errEl.classList.add('show');
 btn.disabled = false;
 btn.textContent = originalLabel;
 }
 },

 async resetPassword() {
 const errEl = document.getElementById('authError');
 const okEl = document.getElementById('authSuccess');
 const email = document.getElementById('authEmail').value.trim();

 errEl.classList.remove('show');
 okEl.classList.remove('show');

 if (!email) {
 errEl.textContent = "Enter your email above first, then tap \"Forgot password?\" again.";
 errEl.classList.add('show');
 return;
 }
 try {
 await auth.sendPasswordResetEmail(email);
 okEl.textContent = "Password reset email sent — check your inbox.";
 okEl.classList.add('show');
 } catch (err) {
 errEl.textContent = friendlyAuthError(err);
 errEl.classList.add('show');
 }
 },

 setName(type, idx, val) { state[type][idx].name = val; },
 setAmount(type, idx, val) { state[type][idx].amount = val === '' ? 0 : parseFloat(val); },
 add(type) { state[type].push({ name: "", amount: 0 }); render(); },
 remove(type, idx) { state[type].splice(idx, 1); render(); },
 save() { saveSalary(); },
 setView(v) { view = v; render(); },
 addExpense() {
 const dayEl = document.getElementById('expDay');
 const noteEl = document.getElementById('expNote');
 const amtEl = document.getElementById('expAmt');
 const day = Math.min(Math.max(parseInt(dayEl.value) || todayDefaultDay(), 1), daysInMonth(state.year, state.month));
 const note = noteEl.value.trim();
 const amount = parseFloat(amtEl.value) || 0;
 if (amount <= 0) return;
 state.expenses.push({ id: Date.now() + '-' + Math.random().toString(36).slice(2,7), day, note, amount });
 state.expenses.sort((a,b) => a.day - b.day);
 saveExpenses();
 },
 removeExpense(id) {
 state.expenses = state.expenses.filter(e => e.id !== id);
 saveExpenses();
 },
 shiftMonth(dir) {
 let m = state.month + dir, y = state.year;
 if (m < 0) { m = 11; y -= 1; }
 if (m > 11) { m = 0; y += 1; }
 state.month = m; state.year = y;
 listenToMonth(y, m);
 },
 goTo(year, month) {
 state.year = year; state.month = month;
 listenToMonth(year, month);
 window.scrollTo({ top: 0, behavior: 'smooth' });
 }
 };
})();
if ('serviceWorker' in navigator) {
 window.addEventListener('load', () => {
 navigator.serviceWorker.register('sw.js').catch(() => {});
 });
}
</script>
</body>
</html>
