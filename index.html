<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Salary Ledger</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12181F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #12181F;
    --ink-2: #1B232D;
    --paper: #F7F3EA;
    --brass: #B08D57;
    --brass-bright: #D4AF6A;
    --green: #5C8A6E;
    --rust: #B15A47;
    --text-hi: #F2EEE3;
    --text-lo: #9CA6AF;
    --line: rgba(242,238,227,0.10);
    --serif: 'Source Serif 4', Georgia, serif;
    --sans: 'Inter', -apple-system, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--ink);
    color: var(--text-hi);
    font-family: var(--sans);
    min-height: 100vh;
  }
  #app { max-width: 480px; margin: 0 auto; padding: 20px 18px 60px; }

  /* Header */
  .header { padding: 8px 2px 22px; }
  .header .eyebrow { font-size: 13px; color: var(--brass-bright); letter-spacing: 0.02em; }
  .header h1 { font-family: var(--serif); font-weight: 600; font-size: 28px; margin: 4px 0 0; }

  /* Tabs */
  .tabs {
    display: flex; background: var(--ink-2); border: 1px solid var(--line);
    border-radius: 14px; padding: 4px; margin-bottom: 16px;
  }
  .tabs button {
    flex: 1; padding: 10px 0; border: none; border-radius: 10px; background: none;
    color: var(--text-lo); font-family: var(--sans); font-weight: 600; font-size: 14px; cursor: pointer;
  }
  .tabs button.active { background: var(--brass); color: var(--ink); }

  /* Month switcher */
  .month-bar {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--ink-2); border: 1px solid var(--line); border-radius: 14px;
    padding: 10px 8px; margin-bottom: 16px;
  }
  .month-bar button {
    background: none; border: none; color: var(--text-hi); font-size: 20px;
    width: 40px; height: 40px; border-radius: 10px; cursor: pointer;
  }
  .month-bar button:active { background: var(--line); }
  .month-label { font-family: var(--serif); font-size: 17px; font-weight: 600; }

  /* Hero card */
  .hero {
    background: linear-gradient(155deg, #1E2733, var(--ink-2));
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 26px 22px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }
  .hero::after {
    content: '';
    position: absolute; right: -40px; top: -40px;
    width: 140px; height: 140px; border-radius: 50%;
    background: radial-gradient(circle, rgba(176,141,87,0.18), transparent 70%);
  }
  .hero .label { font-size: 13px; color: var(--text-lo); margin-bottom: 6px; }
  .hero .amount { font-family: var(--serif); font-size: 42px; font-weight: 700; color: var(--brass-bright); line-height: 1.1; }
  .hero .sub { font-size: 13px; color: var(--text-lo); margin-top: 10px; display: flex; gap: 16px; flex-wrap: wrap; }
  .hero .sub span b { color: var(--text-hi); font-weight: 600; }

  /* Section cards */
  .card {
    background: var(--ink-2);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .card h2 {
    font-family: var(--serif); font-weight: 600; font-size: 16px;
    margin: 0 0 12px; display: flex; align-items: center; justify-content: space-between;
  }
  .card h2 .add-btn {
    font-family: var(--sans); font-size: 13px; color: var(--brass-bright);
    background: none; border: none; cursor: pointer; padding: 4px 8px;
  }

  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0; border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: none; }
  .row input[type="text"] {
    flex: 1; background: none; border: none; color: var(--text-hi);
    font-family: var(--sans); font-size: 14.5px; padding: 6px 0; min-width: 0;
  }
  .row input[type="text"]::placeholder { color: var(--text-lo); }
  .row .amt-wrap { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
  .row .amt-wrap span { color: var(--text-lo); font-size: 14px; }
  .row input[type="number"] {
    width: 88px; background: none; border: none; color: var(--text-hi);
    font-family: var(--sans); font-size: 14.5px; text-align: right; padding: 6px 0;
  }
  .row input[type="number"]::-webkit-outer-spin-button,
  .row input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .row .del {
    background: none; border: none; color: var(--text-lo); font-size: 17px;
    width: 26px; height: 26px; cursor: pointer; flex-shrink: 0;
  }
  .row .del:active { color: var(--rust); }

  .card .total-row {
    display: flex; justify-content: space-between; padding-top: 12px; margin-top: 4px;
    font-weight: 600; font-size: 15px;
  }
  .card.deductions .total-row .val { color: var(--rust); }
  .card.earnings .total-row .val { color: var(--green); }
  .card.spending .total-row .val { color: var(--rust); }

  /* Save button */
  .save-btn {
    width: 100%; padding: 15px; border-radius: 14px; border: none;
    background: var(--brass); color: var(--ink); font-family: var(--sans);
    font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 4px;
  }
  .save-btn:active { background: var(--brass-bright); }
  .save-msg {
    text-align: center; font-size: 13px; color: var(--green); height: 18px;
    margin-top: 8px; opacity: 0; transition: opacity 0.3s;
  }
  .save-msg.show { opacity: 1; }

  /* Expense entry form */
  .expense-form {
    display: flex; gap: 8px; margin-bottom: 12px; align-items: center;
  }
  .expense-form .day-input {
    width: 48px; background: var(--ink); border: 1px solid var(--line); border-radius: 8px;
    color: var(--text-hi); font-size: 14px; text-align: center; padding: 8px 4px;
  }
  .expense-form .note-input {
    flex: 1; background: var(--ink); border: 1px solid var(--line); border-radius: 8px;
    color: var(--text-hi); font-size: 14px; padding: 8px 10px; min-width: 0;
  }
  .expense-form .amt-input {
    width: 78px; background: var(--ink); border: 1px solid var(--line); border-radius: 8px;
    color: var(--text-hi); font-size: 14px; text-align: right; padding: 8px 8px;
  }
  .expense-form input::placeholder { color: var(--text-lo); }
  .expense-form .add-expense-btn {
    background: var(--brass); border: none; color: var(--ink); border-radius: 8px;
    width: 38px; height: 38px; font-size: 18px; font-weight: 700; cursor: pointer; flex-shrink: 0;
  }

  .expense-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line);
  }
  .expense-row:last-child { border-bottom: none; }
  .expense-row .day-badge {
    width: 34px; height: 34px; border-radius: 9px; background: var(--ink);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--serif); font-size: 13px; color: var(--text-lo); flex-shrink: 0;
  }
  .expense-row .note { flex: 1; font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .expense-row .amt { font-size: 14.5px; font-weight: 600; color: var(--rust); flex-shrink: 0; }
  .expense-row .del { background: none; border: none; color: var(--text-lo); font-size: 16px; cursor: pointer; flex-shrink: 0; width: 24px; }
  .expense-row .del:active { color: var(--rust); }

  /* History */
  .history-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 4px; border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .history-item:last-child { border-bottom: none; }
  .history-item .h-left .h-month { font-size: 14.5px; font-weight: 500; }
  .history-item .h-left .h-sub { font-size: 12px; color: var(--text-lo); margin-top: 2px; }
  .history-item .h-net { font-family: var(--serif); font-size: 16px; font-weight: 600; color: var(--brass-bright); }
  .empty-state { color: var(--text-lo); font-size: 13.5px; padding: 6px 4px 2px; line-height: 1.5; }

  .loading { text-align: center; color: var(--text-lo); padding: 40px 0; font-size: 14px; }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="eyebrow">Salary Ledger</div>
    <h1>Your pay, tracked</h1>
  </div>
  <div id="content" class="loading">Loading your records…</div>
</div>

<script>
(function() {
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  let view = 'salary';
  let state = {
    year: new Date().getFullYear(),
    month: new Date().getMonth(),
    earnings: [{ name: "Basic pay", amount: 0 }],
    deductions: [],
    expenses: []
  };
  let history = [];

  function salaryKey(year, month) { return `salary:${year}-${String(month+1).padStart(2,'0')}`; }
  function expenseKey(year, month) { return `expenses:${year}-${String(month+1).padStart(2,'0')}`; }
  function fmt(n) {
    const v = Number(n) || 0;
    return v.toLocaleString(undefined, { maximumFractionDigits: 2 });
  }
  function sum(arr) { return arr.reduce((a,b) => a + (Number(b.amount) || 0), 0); }
  function daysInMonth(year, month) { return new Date(year, month + 1, 0).getDate(); }

  function loadMonth(year, month) {
    try {
      const rawSalary = localStorage.getItem(salaryKey(year, month));
      if (rawSalary) {
        const data = JSON.parse(rawSalary);
        state.earnings = data.earnings && data.earnings.length ? data.earnings : [{ name: "Basic pay", amount: 0 }];
        state.deductions = data.deductions || [];
      } else {
        state.earnings = [{ name: "Basic pay", amount: 0 }];
        state.deductions = [];
      }
    } catch (e) {
      state.earnings = [{ name: "Basic pay", amount: 0 }];
      state.deductions = [];
    }

    try {
      const rawExpenses = localStorage.getItem(expenseKey(year, month));
      if (rawExpenses) {
        const d = JSON.parse(rawExpenses);
        state.expenses = (d.items || []).sort((a,b) => a.day - b.day);
      } else {
        state.expenses = [];
      }
    } catch (e) {
      state.expenses = [];
    }
  }

  function loadHistory() {
    const items = [];
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.startsWith('salary:')) {
          const raw = localStorage.getItem(key);
          if (raw) {
            const d = JSON.parse(raw);
            const gross = sum(d.earnings || []);
            const ded = sum(d.deductions || []);
            let spent = 0;
            try {
              const rawExp = localStorage.getItem(expenseKey(d.year, d.month));
              if (rawExp) spent = sum((JSON.parse(rawExp).items || []));
            } catch(e) {}
            items.push({ key, year: d.year, month: d.month, gross, ded, spent, net: gross - ded });
          }
        }
      }
      items.sort((a,b) => (b.year - a.year) || (b.month - a.month));
      history = items;
    } catch (e) {
      history = [];
    }
  }

  function saveSalary() {
    const payload = { year: state.year, month: state.month, earnings: state.earnings, deductions: state.deductions };
    localStorage.setItem(salaryKey(state.year, state.month), JSON.stringify(payload));
    loadHistory();
    render();
    flashMsg();
  }

  function saveExpenses() {
    const payload = { year: state.year, month: state.month, items: state.expenses };
    localStorage.setItem(expenseKey(state.year, state.month), JSON.stringify(payload));
    loadHistory();
  }

  function flashMsg() {
    const msg = document.getElementById('saveMsg');
    if (msg) {
      msg.classList.add('show');
      setTimeout(() => msg.classList.remove('show'), 1800);
    }
  }

  function addRow(type) {
    state[type].push({ name: "", amount: 0 });
    render();
  }
  function delRow(type, idx) {
    state[type].splice(idx, 1);
    render();
    if (type !== 'expenses') updateTotals();
  }

  function updateTotals() {
    const gross = sum(state.earnings);
    const ded = sum(state.deductions);
    const spent = sum(state.expenses);
    const net = gross - ded;
    const remaining = net - spent;
    const netEl = document.getElementById('netAmount');
    const grossEl = document.getElementById('grossVal');
    const dedEl = document.getElementById('dedVal');
    const earnTotalEl = document.getElementById('earnTotal');
    const dedTotalEl = document.getElementById('dedTotal');
    const spentTotalEl = document.getElementById('spentTotal');
    const remainingEl = document.getElementById('remainingVal');
    const heroLabelEl = document.getElementById('heroLabel');
    if (view === 'salary') {
      if (netEl) netEl.textContent = fmt(net);
      if (heroLabelEl) heroLabelEl.textContent = 'Net pay this month';
    } else {
      if (netEl) netEl.textContent = fmt(remaining);
      if (heroLabelEl) heroLabelEl.textContent = 'Remaining after spending';
    }
    if (grossEl) grossEl.textContent = fmt(gross);
    if (dedEl) dedEl.textContent = fmt(ded);
    if (earnTotalEl) earnTotalEl.textContent = fmt(gross);
    if (dedTotalEl) dedTotalEl.textContent = fmt(ded);
    if (spentTotalEl) spentTotalEl.textContent = fmt(spent);
    if (remainingEl) remainingEl.textContent = fmt(remaining);
  }

  function rowsHtml(type) {
    return state[type].map((item, idx) => `
      <div class="row">
        <input type="text" placeholder="${type === 'earnings' ? 'e.g. House rent allowance' : 'e.g. Insurance premium'}"
          value="${item.name.replace(/"/g,'&quot;')}"
          oninput="__salaryApp.setName('${type}', ${idx}, this.value)">
        <div class="amt-wrap">
          <span>Rs</span>
          <input type="number" inputmode="decimal" value="${item.amount || ''}" placeholder="0"
            oninput="__salaryApp.setAmount('${type}', ${idx}, this.value)">
        </div>
        <button class="del" onclick="__salaryApp.remove('${type}', ${idx})" aria-label="Remove">✕</button>
      </div>
    `).join('');
  }

  function expenseRowsHtml() {
    if (!state.expenses.length) {
      return `<div class="empty-state">No spending logged yet for ${MONTHS[state.month]}. Add today's expense above.</div>`;
    }
    return state.expenses.map((item) => `
      <div class="expense-row">
        <div class="day-badge">${item.day}</div>
        <div class="note">${(item.note || 'Spending').replace(/</g,'&lt;')}</div>
        <div class="amt">Rs ${fmt(item.amount)}</div>
        <button class="del" onclick="__salaryApp.removeExpense('${item.id}')" aria-label="Remove">✕</button>
      </div>
    `).join('');
  }

  function historyHtml() {
    if (!history.length) {
      return `<div class="empty-state">No saved months yet. Fill in this month's numbers and tap Save to start your ledger.</div>`;
    }
    return history.map(h => `
      <div class="history-item" onclick="__salaryApp.goTo(${h.year}, ${h.month})">
        <div class="h-left">
          <div class="h-month">${MONTHS[h.month]} ${h.year}</div>
          <div class="h-sub">Gross Rs ${fmt(h.gross)} · Spent Rs ${fmt(h.spent)}</div>
        </div>
        <div class="h-net">Rs ${fmt(h.net - h.spent)}</div>
      </div>
    `).join('');
  }

  function todayDefaultDay() {
    const now = new Date();
    if (now.getFullYear() === state.year && now.getMonth() === state.month) return now.getDate();
    return 1;
  }

  function renderSalaryView() {
    const gross = sum(state.earnings);
    const ded = sum(state.deductions);
    const net = gross - ded;
    return `
      <div class="hero">
        <div class="label" id="heroLabel">Net pay this month</div>
        <div class="amount">Rs <span id="netAmount">${fmt(net)}</span></div>
        <div class="sub">
          <span>Gross <b id="grossVal">${fmt(gross)}</b></span>
          <span>Deductions <b id="dedVal">${fmt(ded)}</b></span>
        </div>
      </div>

      <div class="card earnings">
        <h2>Earnings <button class="add-btn" onclick="__salaryApp.add('earnings')">+ Add line</button></h2>
        <div id="earningsRows">${rowsHtml('earnings')}</div>
        <div class="total-row"><span>Total earnings</span><span class="val">Rs <span id="earnTotal">${fmt(gross)}</span></span></div>
      </div>

      <div class="card deductions">
        <h2>Deductions <button class="add-btn" onclick="__salaryApp.add('deductions')">+ Add line</button></h2>
        <div id="deductionsRows">${rowsHtml('deductions')}</div>
        <div class="total-row"><span>Total deductions</span><span class="val">Rs <span id="dedTotal">${fmt(ded)}</span></span></div>
      </div>

      <button class="save-btn" onclick="__salaryApp.save()">Save ${MONTHS[state.month]} ${state.year}</button>
      <div class="save-msg" id="saveMsg">Saved to your ledger</div>
    `;
  }

  function renderSpendingView() {
    const gross = sum(state.earnings);
    const ded = sum(state.deductions);
    const net = gross - ded;
    const spent = sum(state.expenses);
    const remaining = net - spent;
    return `
      <div class="hero">
        <div class="label" id="heroLabel">Remaining after spending</div>
        <div class="amount">Rs <span id="netAmount">${fmt(remaining)}</span></div>
        <div class="sub">
          <span>Net pay <b id="grossVal">${fmt(net)}</b></span>
          <span>Spent so far <b id="dedVal">${fmt(spent)}</b></span>
        </div>
      </div>

      <div class="card spending">
        <h2>Add an expense</h2>
        <div class="expense-form">
          <input type="number" class="day-input" id="expDay" min="1" max="${daysInMonth(state.year, state.month)}" value="${todayDefaultDay()}" placeholder="Day">
          <input type="text" class="note-input" id="expNote" placeholder="What did you spend on?">
          <input type="number" class="amt-input" id="expAmt" placeholder="Rs">
          <button class="add-expense-btn" onclick="__salaryApp.addExpense()" aria-label="Add expense">+</button>
        </div>
      </div>

      <div class="card spending">
        <h2>${MONTHS[state.month]} spending</h2>
        <div id="expenseRows">${expenseRowsHtml()}</div>
        <div class="total-row"><span>Total spent</span><span class="val">Rs <span id="spentTotal">${fmt(spent)}</span></span></div>
      </div>
      <div class="save-msg show" style="color: var(--text-lo);" id="remainingNote">Rs <span id="remainingVal">${fmt(remaining)}</span> left of this month's net pay</div>
    `;
  }

  function render() {
    document.getElementById('content').innerHTML = `
      <div class="tabs">
        <button class="${view === 'salary' ? 'active' : ''}" onclick="__salaryApp.setView('salary')">Salary</button>
        <button class="${view === 'spending' ? 'active' : ''}" onclick="__salaryApp.setView('spending')">Daily spending</button>
      </div>

      <div class="month-bar">
        <button onclick="__salaryApp.shiftMonth(-1)" aria-label="Previous month">‹</button>
        <div class="month-label">${MONTHS[state.month]} ${state.year}</div>
        <button onclick="__salaryApp.shiftMonth(1)" aria-label="Next month">›</button>
      </div>

      ${view === 'salary' ? renderSalaryView() : renderSpendingView()}

      <div class="card" style="margin-top: 22px;">
        <h2>History</h2>
        <div id="historyList">${historyHtml()}</div>
      </div>
    `;
  }

  window.__salaryApp = {
    setName(type, idx, val) { state[type][idx].name = val; },
    setAmount(type, idx, val) { state[type][idx].amount = val === '' ? 0 : parseFloat(val); updateTotals(); },
    add(type) { addRow(type); },
    remove(type, idx) { delRow(type, idx); },
    save() { saveSalary(); },
    setView(v) { view = v; render(); },
    addExpense() {
      const dayEl = document.getElementById('expDay');
      const noteEl = document.getElementById('expNote');
      const amtEl = document.getElementById('expAmt');
      const day = Math.min(Math.max(parseInt(dayEl.value) || todayDefaultDay(), 1), daysInMonth(state.year, state.month));
      const note = noteEl.value.trim();
      const amount = parseFloat(amtEl.value) || 0;
      if (amount <= 0) { amtEl.focus(); return; }
      state.expenses.push({ id: Date.now() + '-' + Math.random().toString(36).slice(2,7), day, note, amount });
      state.expenses.sort((a,b) => a.day - b.day);
      saveExpenses();
      render();
    },
    removeExpense(id) {
      state.expenses = state.expenses.filter(e => e.id !== id);
      saveExpenses();
      render();
    },
    shiftMonth(dir) {
      let m = state.month + dir, y = state.year;
      if (m < 0) { m = 11; y -= 1; }
      if (m > 11) { m = 0; y += 1; }
      state.month = m; state.year = y;
      loadMonth(y, m);
      render();
    },
    goTo(year, month) {
      state.year = year; state.month = month;
      loadMonth(year, month);
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  };

  function init() {
    loadMonth(state.year, state.month);
    loadHistory();
    render();
  }

  init();
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
